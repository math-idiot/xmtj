<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>精粹 · 巡夢圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">

</head><body><div class="page" id="app"></div>
<script src="../共用.js?v=202611252050"></script>
<script>const 類型 = x => String(x.名稱 || "").split("·")[1] || null;

const 組前綴 = x => String(x.編號 || "").slice(0, 3);

const 部位 = o => String(o.名稱 || "").split("·")[1] || "";

const 部序 = [ "發冠", "衣服", "護腕", "鞋靴", "配飾" ];

async function 家族(x, 清單) {
 const 我組 = 組前綴(x), 我部 = 類型(x), 我質 = x.品質;
 const 同 = f => (清單 || []).filter((o => o.名 !== x._名 && 組前綴(o) === 我組 && f(o)));
 return (await 索引排("精粹", 同((o => 部位(o) === 我部)), null, "同一部位,不同品質") || "") + (await 索引排("精粹", 同((o => o.品質 === 我質 && 部位(o) !== 我部)).sort(((p, q) => 部序.indexOf(部位(p)) - 部序.indexOf(部位(q)))), null, "同一品質,不同部位", null, null, true) || "");
}

async function 獲取合(x, 清單) {
 const 同名 = (清單 || []).filter((o => o.名稱 === x.名稱 && o.名 !== x._名));
 const 其他 = (await Promise.all(同名.map((o => 類資料("精粹", o.名).catch((() => null)))))).filter(Boolean);
 if (!其他.length) return 獲取頁(x);
 const 併 = Object.assign({}, x), 途 = Object.assign({}, x.獲得途徑 || {});
 for (const o of 其他) {
  const t = o.獲得途徑 || {};
  for (const k of [ "遊戲標示", "正向來源", "反查" ]) 途[k] = [ ...途[k] || [], ...t[k] || [] ];
  併.反查來源 = [ ...併.反查來源 || [], ...o.反查來源 || [] ];
  併.玩法來源 = [ ...併.玩法來源 || [], ...o.玩法來源 || [] ];
 }
 併.獲得途徑 = 途;
 return 獲取頁(併);
}

開範本({
 "類別": "精粹",
 "副標": x => [ 類型(x) ],
 "分頁": async (x, 清單) => [ [ "資訊", rows([ [ "品質", x => x.品質 ], [ "說明", x => x.說明 ], [ "類型", x => 類型(x) ], [ "等級上限", x => x.等級上限 ] ], x) + await 家族(x, 清單) ], [ "獲取", await 獲取合(x, 清單) || '<p class="note">尚未建檔</p>' ], [ "其他", rows([ [ "編號", x => x.編號 ], [ "對應圖像編號", x => x.對應圖像編號 ] ], x) ] ]
});</script></body></html>
