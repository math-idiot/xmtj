<script>async function 用途板(x, 清單) {
 const 關 = await 用途頁(x);
 if (關) return 關;
 let 開 = "";
 const 明 = x.開出明細 || [];
 if (明.length) {
  const 解 = await Promise.all(明.map((async o => o.類 ? o : Object.assign({}, o, await 解獎勵(o.名) || {}))));
  const 卡 = await Promise.all(解.filter((o => o.類)).map((o => 引用塊({
   "類": o.類,
   "名": o.名,
   "量": (o.數量 ?? o.量) > 1 ? o.數量 ?? o.量 : null,
   "附註": o.機率 != null ? o.機率 + "%" : null
  }))));
  const 文 = 解.filter((o => !o.類)).map((o => `<span class="way"><b class="mono">${esc(o.名)}</b></span>`));
  開 = (卡.length ? `<div class="objs fam">${卡.join("")}</div>` : "") + (文.length ? `<div class="ways">${文.join("")}</div>` : "");
 } else 開 = await 獎勵排(x.開出內容, null);
 const 題 = x.可選件數 ? "可選 " + x.可選件數 + " 件" : "開出內容";
 let 合 = "";
 if (x.是否可合成 && x.合成 && x.合成.合成為) 合 = await 名字排([ {
  "名": x.合成.合成為.名稱
 } ], null);
 const 料 = x.合成材料 ? [ {
  "名": x.合成材料.名稱,
  "量": x.合成材料.需要數量
 } ] : 合 && x.合成.需要數量 ? [ {
  "名": x.名稱,
  "量": x.合成.需要數量
 } ] : [];
 const 材 = 料.length ? await 名字排(料, "用什麼合成") : "";
 const 換 = await 名字排(x.可用於兌換, null);
 const 用 = "";
 return `<h3 class="grp">${esc(題)}</h3>` + (開 || '<p class="note">不可開啟</p>') + 材 + `<h3 class="grp">合成為</h3>` + (合 || '<p class="note">不可合成</p>') + `<h3 class="grp">可以換到</h3>` + (換 || '<p class="note">不可兌換</p>') + (用 || `<h3 class="grp">拿去哪裡用</h3><p class="note">沒有</p>`);
}

const 空 = t => `<p class="note">${esc(t)}</p>`;

開範本({
 "類別": "道具",
