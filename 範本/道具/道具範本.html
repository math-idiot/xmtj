<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>道具 · 巡夢圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../共用.css?v=202611232014">
</head><body><div class="page" id="app"></div>
<script src="../共用.js?v=202611232014"></script>
<script>async function 用途板(x, 清單) {
 const 關 = await 用途頁(x);
 if (關) return 關;
 let 開 = "";
 const 明 = x.開出明細 || [];
 if (明.length) {
  const 解 = await Promise.all(明.map((async o => o.類 ? o : Object.assign({}, o, await 解獎勵(o.名) || {}))));
  const 卡 = await Promise.all(解.filter((o => o.類)).map((o => 引用塊({
   "類": o.類,
   "名": o.名,
   "量": (o.數量 ?? o.量) > 1 ? o.數量 ?? o.量 : null,
   "附註": o.機率 != null ? o.機率 + "%" : null
  }))));
  const 文 = 解.filter((o => !o.類)).map((o => `<span class="way"><b class="mono">${esc(o.名)}</b></span>`));
  開 = (卡.length ? `<div class="objs fam">${卡.join("")}</div>` : "") + (文.length ? `<div class="ways">${文.join("")}</div>` : "");
 } else 開 = await 獎勵排(x.開出內容, null);
 const 題 = x.可選件數 ? "可選 " + x.可選件數 + " 件" : "開出內容";
 let 合 = "";
 if (x.是否可合成 && x.合成 && x.合成.合成為) 合 = await 名字排([ {
  "名": x.合成.合成為.名稱
 } ], null);
 const 料 = x.合成材料 ? [ {
  "名": x.合成材料.名稱,
  "量": x.合成材料.需要數量
 } ] : 合 && x.合成.需要數量 ? [ {
  "名": x.名稱,
  "量": x.合成.需要數量
 } ] : [];
 const 材 = 料.length ? await 名字排(料, "用什麼合成") : "";
 const 換 = await 名字排(x.可用於兌換, null);
 const 用 = "";
 return `<h3 class="grp">${esc(題)}</h3>` + (開 || '<p class="note">不可開啟</p>') + 材 + `<h3 class="grp">合成為</h3>` + (合 || '<p class="note">不可合成</p>') + `<h3 class="grp">可以換到</h3>` + (換 || '<p class="note">不可兌換</p>') + (用 || `<h3 class="grp">拿去哪裡用</h3><p class="note">沒有</p>`);
}

const 空 = t => `<p class="note">${esc(t)}</p>`;

開範本({
 "類別": "道具",
 "副標": x => [ (x.類型 || {}).背包分頁, null ],
 "分頁": async (x, 清單) => [ [ "資訊", rows([ [ "品質", x => x.品質 ], [ "說明", x => x.說明 ], [ "背包分頁", x => (x.類型 || {}).背包分頁 ], [ "主類型", x => (x.類型 || {}).主類型 ], [ "使用上限", x => x.使用上限 ], [ "等級上限", x => x.等級上限 ] ], x) + (await 變體排("道具", x, 清單, "同一系列") || `<h3 class="grp">同一系列</h3><p class="note">沒有</p>`) + (await 名字排(x.同階的其他種類, "同階的其他種類") || `<h3 class="grp">同階的其他種類</h3><p class="note">沒有</p>`) ], [ "獲取方式", async () => await 獲取頁(x) || '<p class="note">尚未建檔</p>' ], [ "用途", async () => await 用途板(x, 清單) ], [ "其他", rows([ [ "編號", x => x.編號 ], [ "對應圖像編號", x => x.對應圖像編號 ], [ "價格", x => (x.價格 || {}).購買 || (x.價格 || {}).售出 ] ], x) ] ]
});</script></body></html>
