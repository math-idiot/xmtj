<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>寶石 · 巡夢圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../共用.css?v=202611232019">
</head><body><div class="page" id="app"></div>
<script src="../共用.js?v=202611232019"></script>
<script>const 屬 = o => (/^\d+級(.+?)寶石$/.exec(o && (o.名稱 || o.名) || "") || [])[1] || null;

async function 家族(x, 清單) {
 const 我屬 = 屬(x), 我級 = x.等級;
 const 同屬 = (清單 || []).filter((o => o.名 !== x._名 && 屬(o) === 我屬));
 const 同級 = (清單 || []).filter((o => o.名 !== x._名 && o.等級 === 我級 && 屬(o) !== 我屬)).sort(((a, b) => (a.編號 || 0) - (b.編號 || 0)));
 return (await 索引排("寶石", 同屬, null, "同屬不同等") || "") + (await 索引排("寶石", 同級, null, "同等不同屬") || "");
}

const 一顆要幾顆 = 3;

async function 合成排(x, 清單) {
 const 我屬 = 屬(x), 上 = +x.等級上限 || 9;
 const 同屬 = (清單 || []).filter((o => 屬(o) === 我屬));
 const 由級 = new Map(同屬.map((o => [ o.等級, o ])));
 if (同屬.length < 2) return "";
 const 料名 = 同屬.sort(((a, b) => a.等級 - b.等級)).map((o => o.名));
 return 階梯板({
  "樣式": "拉桿",
  "鍵": "寶石合成",
  "下限": x.等級,
  "上限": 上,
  "單位": "",
  "起始": x.等級,
  "目標": 上,
  "格式": v => v + " 級",
  "圖": v => {
   const o = 由級.get(v);
   return o ? `<img src="${window.素材基底}寶石/${encodeURIComponent(o.名)}/圖.png" alt="">` : "";
  },
  "材料": 料名.map((n => ({
   "類": "寶石",
   "名": n
  }))),
  "算": (a, b) => {
   const o = 由級.get(Math.min(a, b));
   const n = Math.abs(b - a);
   return o && n ? {
    [o.名]: Math.pow(一顆要幾顆, n) - 1
   } : {};
  },
  "量格式": n => n >= 1e4 ? (n / 1e4).toFixed(2).replace(/\.?0+$/, "") + "萬" : String(n),
  "註": `${一顆要幾顆} 顆同級同屬換一顆高一級的,所以升 n 級是 ${一顆要幾顆}ⁿ−1 顆 —— 跟遊戲一樣不把手上那顆算進去。`
 });
}

async function 合成來源(x, 清單) {
 const 低 = (清單 || []).find((o => 屬(o) === 屬(x) && o.等級 === x.等級 - 1));
 return 低 ? await 引用排([ {
  "類": "寶石",
  "名": 低.名,
  "量": 一顆要幾顆
 } ], "合成") : "";
}

開範本({
 "類別": "寶石",
 "副標": x => [ x.等級 != null ? x.等級 + " 級" : null, 屬(x) ],
 "分頁": async (x, 清單) => [ [ "資訊", rows([ [ "品質", x => x.品質 ], [ "等級", x => x.等級 ], [ "屬性", x => 屬(x) ], [ "效果", x => x.說明 ], [ "加成", x => (x.屬性加成 || []).map((a => a.屬性 + " +" + a.值 + a.單位)).join("、") ], [ "等級上限", x => x.等級上限 ], [ "使用上限", x => x.使用上限 ] ], x) + await 名字排([ (x.價格 || {}).購買 ].filter(Boolean), "購買價格") + await 家族(x, 清單) ], [ "合成", await 合成排(x, 清單) || '<p class="note">不可合成</p>' ], [ "獲取", async () => await 獲取頁(x) || "" + (await 合成來源(x, 清單) || "") || '<p class="note">尚未建檔</p>' ], [ "其他", rows([ [ "編號", x => x.編號 ], [ "對應圖像編號", x => x.對應圖像編號 ], [ "背包分頁", x => (x.類型 || {}).背包分頁 ] ], x) ] ]
});</script></body></html>
