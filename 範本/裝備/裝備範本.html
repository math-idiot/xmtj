<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>裝備 · 巡夢圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../共用.css?v=202611240032">
</head><body><div class="page" id="app"></div>
<script src="../共用.js?v=202611240032"></script>
<script>const 類別 = "裝備";

const 基 = () => window.素材基底 + 類別 + "/";

const _快 = new Map;

const 讀 = 路 => _讀(路);

const 索引 = () => 讀(基() + "_索引.json").then((d => d && d.清單 || []));

const 一筆 = 名 => 讀(基() + 名.split("/").map(encodeURIComponent).join("/") + "/資料.json");

const 強化表 = () => 讀(基() + "_強化消耗.json");

const 共鳴表 = () => 讀(基() + "_共鳴.json");

const 本頁 = n => "#/" + encodeURIComponent(類別) + "/" + n.split("/").map(encodeURIComponent).join("/");

const 空 = t => `<p class="note">${esc(t)}</p>`;

const 錢 = n => {
 const 單 = (v, u) => v.toFixed(2).replace(/\.?0+$/, "") + u;
 if (n >= 1e8) return 單(n / 1e8, "億");
 if (n >= 1e4) return 單(n / 1e4, "萬");
 return String(n);
};

const 算屬 = (p, lv) => Math.round(p.基礎) + Math.floor(p.配置值 * Math.pow(lv, p.係數));

async function 獲取排(x, 全冊, 位) {
 const 道 = await 索引類("道具");
 const 是道具 = n => 道.some((o => o.名 === n));
 const 全 = [ ...(x.獲取 || []).map((o => o.名稱)), ...x.反查來源 || [] ].filter((n => n && !/待查/.test(n)));
 const 名單 = [ ...new Set(全) ];
 const 道序 = 稀排(名單.filter(是道具).map((名 => 道.find((o => o.名 === 名)) || {
  "名": 名
 })));
 const 組 = async (refs, 題) => await 引用排(refs, 題) || `<h3 class="grp">${題}</h3><p class="note">沒有</p>`;
 return await 組(道序.map((o => ({
  "類": "道具",
  "名": o.名
 }))), "道具") + await 組(名單.filter((n => !是道具(n))).map((名 => ({
  "類": "活動",
  "名": 名
 }))), "活動") + await 組(進階來源(x, 全冊, 位), "進階");
}

async function 補部位(清單) {
 if (清單.every((o => o.部位))) return 清單;
 return Promise.all(清單.map((async o => {
  const d = await 一筆(o.名);
  return Object.assign({}, o, {
   "部位": d && d.部位,
   "父": d && d.父 || o.父
  });
 })));
}

const _其索 = new Map;

async function 索引類(類) {
 if (!_其索.has(類)) _其索.set(類, 讀(window.素材基底 + encodeURIComponent(類) + "/_索引.json").then((d => d && d.清單 || [])));
 return _其索.get(類);
}

async function 材料排(字, 標題, 父) {
 if (!字) return "";
 const 項 = String(字).split(/[、,]/).map((s => s.trim())).filter(Boolean);
 const 道 = await 索引類("道具");
 const 卡 = await Promise.all(項.map((async s => {
  const m = /^(.+?)(?:\((\d+)星\))?[×x](\d+)$/.exec(s);
  if (!m) return `<span class="obj"><b>${esc(s)}</b></span>`;
  const [, 名, 星, 量] = m;
  if (星) return 引用塊({
   "類": "裝備",
   "名": 名 + "/" + 星 + "星",
   "量": "×" + 量
  });
  if (道.some((o => o.名 === 名))) return 引用塊({
   "類": "道具",
   "名": 名,
   "量": "×" + 量
  });
  return 引用塊({
   "類": "資源",
   "名": 名,
   "量": "×" + 量
  });
 })));
 return `<h3 class="grp">${esc(標題)}</h3><div class="objs">${卡.join("")}</div>`;
}

const 階序 = [ "白", "綠", "藍", "紫", "橙", "紅" ];

function 進階來源(x, 全, 位) {
 if (+x.星 > 1) return [ {
  "類": "裝備",
  "名": x.父 + "/" + (+x.星 - 1) + "星"
 } ];
 const i = 階序.indexOf(x.品質);
 if (i <= 0) return [];
 const 低 = 全.filter((o => o.品質 === 階序[i - 1] && o.部位 === 位));
 if (!低.length) return [];
 const 滿 = 低.reduce(((a, b) => +b.星 > +a.星 ? b : a));
 return [ {
  "類": "裝備",
  "名": 滿.名
 } ];
}

const 銘刻型 = {
 "頭": "發冠",
 "衣": "衣服",
 "腕": "護腕",
 "靴": "鞋靴",
 "飾": "配飾"
};

async function 銘刻板(x, 位) {
 const 型 = 銘刻型[位];
 if (!型) return 空("不可銘刻");
 if ((稀階[x.品質] || 0) < 稀階["紫"]) return 空("不可銘刻");
 const 全 = await 索引類("精粹");
 const 看 = new Set, 合 = [];
 for (const o of 全) {
  const n = o.名稱 || o.名;
  if (!String(n).endsWith("·" + 型) || 看.has(n)) continue;
  看.add(n);
  合.push(o);
 }
 return await 索引排("精粹", 合, null, "可銘刻的精粹") || 空("尚未建檔");
}

async function 寶石板(x) {
 if (!+x.寶石孔) return 空("不可鑲嵌");
 const 全 = await 索引類("寶石");
 const 群 = new Map;
 for (const o of 全) {
  const m = /^(\d+)級(.+?)寶石$/.exec(o.名稱 || o.名);
  if (!m) continue;
  if (!群.has(m[2])) 群.set(m[2], []);
  群.get(m[2]).push(Object.assign({}, o, {
   "等級": +m[1]
  }));
 }
 const 列 = [ ...群.entries() ].sort(((a, b) => Math.min(...a[1].map((o => +o.編號 || 1e9))) - Math.min(...b[1].map((o => +o.編號 || 1e9)))));
 let h = "";
 for (const [屬, a] of 列) h += await 索引排("寶石", a, null, 屬, null, "lv9");
 return h || 空("尚未建檔");
}

async function 分頁(x, 清單) {
 const 父 = x.父, 星 = x.星, 上限 = x.星級上限;
 const 公 = (x.屬性公式 || {}).屬性 || {};
 const 強 = await 強化表();
 const 共 = await 共鳴表();
 const 全 = await 補部位(清單);
 const 這 = 全.find((o => o.名 === x._名)) || {};
 const 等 = x.品質, 位 = 這.部位 || x.部位;
 const 同 = f => 全.filter((o => o.名 !== x._名 && f(o)));
 const 三行 = await 索引排("裝備", 同((o => o.品質 === 等 && +o.星 === +星 && o.部位 !== 位)), null, "同等級同星級,不同部位") + await 索引排("裝備", 同((o => o.品質 === 等 && o.部位 === 位)), null, "同等級同部位,不同星級") + await 索引排("裝備", 同((o => o.部位 === 位 && +o.星 === +星 && o.品質 !== 等)), null, "同部位同星級,不同等級");
 const 費 = (a, b) => (強 && 強.每級消耗 || []).slice(a, b).reduce(((s, v) => s + v), 0);
 const 等級板 = 強 && 強.每級消耗 ? await 階梯板({
  "樣式": "拉桿",
  "鍵": "裝備強化",
  "圖": v => `<span class="txt">Lv.${v}</span>`,
  "下限": (強.等級範圍 || [ 0, 300 ])[0],
  "上限": (強.等級範圍 || [ 0, 300 ])[1],
  "單位": "級",
  "起始": 0,
  "目標": (強.等級範圍 || [ 0, 300 ])[1],
  "材料": [ {
   "類": "資源",
   "名": "銀兩"
  } ],
  "算": (a, b) => ({
   "銀兩": 費(a, b)
  }),
  "量格式": 錢
 }) : 空("尚未建檔");
 const 等級板加上限 = 等級板 + await 心醫上限板("裝備強化上限");
 const 鏈 = (() => {
  const out = [];
  for (let k = 階序.indexOf(x.品質); k < 階序.length; k++) {
   const 群 = 全.filter((o => o.部位 === 位 && o.品質 === 階序[k]));
   if (!群.length) break;
   out.push({
    "品質": 階序[k],
    "上限": Math.max(...群.map((o => +o.星 || 1))),
    "父": String(群[0].名).split("/")[0]
   });
  }
  return out;
 })();
 const 格 = [];
 鏈.forEach(((q, qi) => {
  for (let st = 1; st <= q.上限; st++) 格.push({
   qi: qi,
   "品質": q.品質,
   "父": q.父,
   "星": st
  });
 }));
 const 現 = Math.max(0, 格.findIndex((g => g.品質 === x.品質 && g.星 === +x.星)));
 const 階消 = {};
 await Promise.all(格.map((async g => {
  const d = await 類資料("裝備", g.父 + "/" + g.星 + "星").catch((() => null));
  if (d && d.升星消耗) 階消[g.父 + "/" + g.星] = d.升星消耗;
 })));
 const 拆一 = 字 => {
  const m = /^(.+?)(?:\((\d+)星\))?[×x](\d+)$/.exec(String(字 || "").trim());
  return m ? {
   "名": m[1],
   "星": m[2] ? +m[2] : null,
   "量": +m[3]
  } : null;
 };
 const 耗名 = [ ...new Set(格.map((g => 拆一(階消[g.父 + "/" + g.星]))).filter((c => c && c.星 == null)).map((c => c.名))) ];
 const 料名 = [ ...new Set([ ...Array.from({
  length: 鏈[0] ? 鏈[0].上限 : 0
 }, ((_, i) => 鏈[0].父 + "/" + (i + 1) + "星")), ...耗名 ]) ];
 const 進階梯 = 格.length > 1 ? await 階梯板({
  "樣式": "拉桿",
  "鍵": "裝備進階",
  "下限": 現,
  "上限": 格.length - 1,
  "單位": "",
  "起始": 現,
  "目標": 格.length - 1,
  "格式": v => {
   const g = 格[Math.max(0, Math.min(格.length - 1, v))];
   return g ? `${g.品質} ${g.星} 星` : "";
  },
  "圖": v => {
   const g = 格[Math.max(0, Math.min(格.length - 1, v))];
   const q = 鏈.find((r => r.品質 === g.品質));
   return g ? 星圖(g.星, q ? q.上限 : g.星) : "";
  },
  "材料": await Promise.all(料名.map((async n => {
   const h = await 找物(n);
   return h && h.類 ? {
    "類": h.類,
    "名": h.名
   } : null;
  }))).then((a => a.filter(Boolean))),
  "算": (a, b) => {
   const 需 = {};
   const 起 = Math.min(a, b), 終 = Math.max(a, b);
   let 幾 = 1;
   for (let p = 終 - 1; p >= 起; p--) {
    const g = 格[p], c = 拆一(階消[g.父 + "/" + g.星]);
    if (!c) continue;
    if (c.星 != null) 幾 *= 1 + c.量; else 需[c.名] = (需[c.名] || 0) + 幾 * c.量;
   }
   if (幾 > 1) {
    const g = 格[起];
    需[g.父 + "/" + g.星 + "星"] = (需[g.父 + "/" + g.星 + "星"] || 0) + (幾 - 1);
   }
   return 需;
  },
  "量格式": 錢,
  "註": "紫以下是同名同星合成(自己 + 2 個),橙以上每一星直接吃綺光花。這裡跟遊戲一樣不把自己算進去。"
 }) : "";
 const 進階板 = 進階梯 || 空(x.星 >= 上限 && 階序.indexOf(x.品質) === 階序.length - 1 ? "不可進階" : "尚未建檔");
 const 符 = (共 && 共.共鳴 || []).filter((r => r.需求品質 === x.品質));
 const 套 = (共 && 共.套裝 || []).filter((r => r.品質 === x.品質));
 const 屬字 = a => (a || []).map((p => p.屬性 ? `${p.屬性}+${p.值}` : p.原碼)).join("、");
 const 共鳴板 = 符.length || 套.length ? (符.length ? `<h3 class="grp">裝備共鳴</h3><div class="rows">${符.map((r => `<div class="row"><dt>${esc(r.需求品質)} ${r.需求件數} 件</dt><dd>${esc(屬字(r.屬性))}</dd></div>`)).join("")}</div>` : "") + (套.length ? `<h3 class="grp">套裝加成</h3><div class="rows">${套.map((r => `<div class="row"><dt>${r.件數} 件</dt><dd>${esc(屬字(r.屬性))}</dd></div>`)).join("")}</div>` : "") : 空("不可共鳴");
 return [ [ "資訊", rows([ [ "部位", x => x.部位 ], [ "品質", x => x.品質 ], [ "星級", x => x.星 + " / " + x.星級上限 + " 星" ], [ "寶石孔", x => x.寶石孔 ], [ "可裝備等級", x => x.可裝備等級 ], [ "基礎屬性", x => x.基礎屬性 ], [ "滿強化", x => x["滿強化(300級)"] ], [ "特殊屬性", x => x.特殊屬性 ] ], x) + 三行 ], [ "獲取方式", await 獲取排(x, 全, 位) || 空("尚未建檔") ], [ "等級", 等級板加上限 ], [ "進階", 進階板 ], [ "銘刻", () => 銘刻板(x, 位) ], [ "寶石", () => 寶石板(x) ], [ "共鳴", 共鳴板 ], [ "分解", await 材料排(x.分解返還, "分解退回") || 空("不可分解") ], [ "其他", rows([ [ "父", x => x.父 ], [ "強化成長", x => x.強化成長 ], [ "所屬組合", x => (x.所屬組合 || []).join("、") ] ], x) + ((x.補充 || []).length ? `<h3 class="grp">補充</h3><ul class="sup">${x.補充.map((b => `<li title="${esc([ b.證據, b.來源 ].filter(Boolean).join(" · "))}">${esc(b.內容)}${b.證據 ? `<span class="ev">${esc(b.證據)}</span>` : ""}</li>`)).join("")}</ul>` : "") ] ];
}

開範本({
 "類別": "裝備",
 "副標": x => [ x.部位 ? x.部位 + "部位" : null, x.星 + " / " + x.星級上限 + " 星" ],
 "分頁": 分頁
});</script></body></html>
