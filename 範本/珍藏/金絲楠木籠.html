9C%E6%99%B6/圖.png&quot;]\" data-f=\"\" onerror=\"快圖退(this)\"><span class=\"ov num\">0</span></span><b>璨光曜晶</b></a>"},"零件":{"格遮罩":"../../素材/介面/格子零件/格遮罩.png","寶石孔底":"../../素材/介面/格子零件/寶石孔底.png","珍寶等級底":"../../素材/介面/格子零件/珍寶等級底.png"},"名":"金絲楠木籠"};</script>

<script>const 拆量 = t => {
 const m = /^(.+?)[×x]\s*([\d,]+)$/.exec(String(t || "").trim());
 return m ? [ m[1].trim(), +m[2].replace(/,/g, "") ] : null;
};

let _珍升;

async function 珍升表() {
 if (_珍升 === undefined || _珍升 === null) _珍升 = await fetch(window.素材基底 + "珍藏/_升級.json").then((r => r.ok ? r.json() : null)).catch((() => null));
 return _珍升;
}

async function 升級板(x) {
 const r = await 珍升表();
 const t = r && x.等級範本 && r.範本[String(x.等級範本)];
 if (!t) return '<p class="note">這件沒有升級資料</p>';
 const 級 = t.級, 上 = 級.length;
 const 名單 = [ ...new Set(級.flatMap((l => Object.keys(l.材料)))) ];
 const 料 = 名單.map((n => {
  const i = n.indexOf("/");
  return {
   "類": n.slice(0, i),
   "名": n.slice(i + 1)
  };
 }));
 return await 階梯板({
  "樣式": "拉桿",
  "鍵": "珍藏升級",
  "下限": 0,
  "上限": 上,
  "單位": "級",
  "起始": 0,
  "目標": 上,
  "圖": v => `<span class="txt">Lv.${v}</span>`,
  "材料": 料,
  "算": (a, b) => {
   const 需 = {};
   for (const l of 級) if (l.級 > a && l.級 <= b) for (const k in l.材料) {
    const nm = k.slice(k.indexOf("/") + 1);
    需[nm] = (需[nm] || 0) + l.材料[k];
   }
   return 需;
  },
  "附文": (a, b) => {
   const l = 級[Math.max(0, b - 1)];
   return b > 0 && l ? l.累計屬性 : "";
  }
 });
}

async function 升星板(x) {
 const 星 = x.星級 || [];
 if (星.length < 2) return "";
 const 上 = Math.max(...星.map((s => +s.星 || 0)));
 const 名單 = [ ...new Set(星.map((s => (拆量(s.消耗) || [])[0])).filter(Boolean)) ];
 const 料 = (await Promise.all(名單.map((n => 找物(n))))).map(((h, i) => h && h.類 ? {
  "類": h.類,
  "名": h.名
 } : null)).filter(Boolean);
 const 梯 = await 階梯板({
  "樣式": "拉桿",
  "鍵": "珍藏升星",
  "下限": 0,
  "上限": 上,
  "單位": "星",
  "起始": 0,
  "目標": 上,
  "圖": v => 星圖(v, 上),
  "材料": 料,
  "算": (a, b) => {
   const 需 = {};
   for (const s of 星) if (+s.星 > a && +s.星 <= b) {
    const c = 拆量(s.消耗);
    if (c) 需[c[0]] = (需[c[0]] || 0) + c[1];
   }
   return 需;
  }
 });
 const 表 = `<h3 class="grp">各星累計屬性</h3><table class="aff"><thead><tr><th>星</th><th>累計屬性</th></tr></thead><tbody>${星.map((s => `<tr><td>${esc(String(s.星))} ★</td><td>${esc(s.累計屬性 || "")}</td></tr>`)).join("")}</tbody></table>`;
 return 梯 + 表;
}

async function 傳記板(x) {
 const a = x.傳記 || [];
 if (!a.length) return "";
 const 塊 = await Promise.all(a.map((async c => {
  const 獎 = c.獎勵 ? await 名字排([ c.獎勵 ], null) : "";
  return `<h3 class="grp">${c.章 != null ? c.章 + "、" : ""}${esc(c.標題 || "")}${c.解鎖星數 != null ? ` <span class="note">(${c.解鎖星數} 星解鎖)</span>` : ""}</h3>` + `<p class="desc">${rich(String(c.內容 || "")).replace(/\n/g, "<br>")}</p>` + (獎 ? `<div class="rows">${kv("獎勵", 獎)}</div>` : "");
 })));
 return 塊.join("");
}

開範本({
 "類別": "珍藏",
 "副標": x => [ x.等級範本 ? "等級範本 " + x.等級範本 : null ],
 "分頁": async (x, 清單) => [ [ "資訊", rows([ [ "品質", x => x.品質 ], [ "說明", x => x.說明 ] ], x) + (x.碎片 ? await 名字排([ x.碎片 ], "碎片") : "") + await 索引排("珍藏", 清單.filter((o => o.品質 === x.品質 && o.名 !== x._名)), x._名, "同品質") ], [ "升級", () => 升級板(x) ], [ "升星", () => 升星板(x) ], [ "傳記", async () => await 傳記板(x) || '<p class="note">沒有傳記</p>' ], [ "獲取", async () => await 獲取頁(x) || '<p class="note">尚未建檔</p>' ], [ "其他", rows([ [ "編號", x => x.id ?? x.編號 ], [ "等級範本", x => x.等級範本 ] ], x) ] ]
});</script></body></html>
