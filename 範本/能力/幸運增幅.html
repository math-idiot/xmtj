<script>function 時長(秒) {
 const d = Math.floor(秒 / 86400), h = Math.floor(秒 % 86400 / 3600), m = Math.floor(秒 % 3600 / 60), s = 秒 % 60;
 return [ d && d + " 天", h && h + " 小時", m && m + " 分", !d && !h && s ? s + " 秒" : "" ].filter(Boolean).join(" ") || "0 秒";
}

const _消耗快 = new Map;

async function 耗卡(字) {
 if (!字) return "";
 if (_消耗快.has(字)) return _消耗快.get(字);
 const m = /^(.+?)[×x](\d+)$/.exec(String(字).trim());
 let h;
 if (!m) h = esc(字); else {
  const 找 = await 找物(m[1]);
  h = 找 ? await 引用塊({
   "類": 找.類,
   "名": 找.名,
   "量": +m[2],
   "顯名": false
  }) : esc(字);
 }
 _消耗快.set(字, h);
 return h;
}

async function 等級頁(x) {
 const L = x.等級 || [];
 if (!L.length) return '<p class="note">沒有逐級資料</p>';
 const 拆 = t => {
  const m = /^(.+?)[×x]([\d,]+)$/.exec(String(t || "").trim());
  return m ? [ m[1], +m[2].replace(/,/g, "") ] : null;
 };
 const 名單 = [ ...new Set(L.map((o => (拆(o.消耗) || [])[0])).filter(Boolean)) ].concat([ "日晷" ]);
 const 料 = await Promise.all(名單.map((async n => {
  const h = await 找物(n);
  return h && h.類 ? {
   "類": h.類,
   "名": h.名
  } : null;
 })));
 const 上 = L.length;
 const 梯 = await 階梯板({
  "樣式": "拉桿",
  "鍵": "能力等級",
  "下限": 1,
  "上限": 上,
  "單位": "級",
  "起始": 1,
  "目標": 上,
  "圖": v => `<span class="txt">Lv.${v}</span>`,
  "材料": 料.filter(Boolean),
  "算": (a, b) => {
   const 需 = {};
   for (const o of L) if (o.級 > a && o.級 <= b) {
    const c = 拆(o.消耗);
    if (c) 需[c[0]] = (需[c[0]] || 0) + c[1];
    需.日晷 = (需.日晷 || 0) + (+o.研習秒數 || 0);
   }
   return 需;
  },
  "附文": (a, b) => {
   let 秒 = 0;
   for (const o of L) if (o.級 > a && o.級 <= b) 秒 += +o.研習秒數 || 0;
   return 秒 ? "研習時間 " + 時長(秒) + "(不用日晷就是等這麼久)" : "";
  },
  "量格式": n => n >= 1e4 ? (n / 1e4).toFixed(2).replace(/\.?0+$/, "") + "萬" : String(n)
 });
 const 效 = L.filter((o => o.效果));
 return 梯 + (效.length ? `<h3 class="grp">哪幾級解鎖效果</h3><ul class="bul">${效.map((o => `<li><b>${o.級} 級</b> ${rich(o.效果)}</li>`)).join("")}</ul>` : "");
}

開範本({
 "類別": "能力",
 "副標": x => [ x.分類, x.心醫階級, x.完美等級 != null ? "完美 " + x.完美等級 + " 級" : null ],
 "分頁": async (x, 清單) => [ [ "資訊", rows([ [ "品質", x => x.品質 ], [ "說明", x => x.說明 ], [ "分類", x => x.分類 ], [ "心醫階級", x => x.心醫階級 ], [ "解鎖等級", x => x.心醫等級 != null ? x.心醫等級 + " 級" : null ], [ "等級數", x => x.等級數 ], [ "完美等級", x => x.完美等級 ] ], x) ], [ "獲取", async () => await 獲取頁(x) || '<p class="note">尚未建檔</p>' ], [ "等級", async () => await 等級頁(x) ], [ "同階級", await 索引排("能力", 清單.filter((o => o.技能階段 != null && o.技能階段 === x.技能階段)).sort(((a, b) => (a.心醫等級 || 0) - (b.心醫等級 || 0))), x._名, x.心醫階級 || "同階級", 120) || '<p class="note">沒有</p>' ], [ "其他", rows([ [ "編號", x => x.編號 ?? x.id ] ], x) ] ]
});</script></body></html>
