 const 別人 = o => o.名 !== 我;
 const a = 清單.filter((o => 屬片(o) && 別人(o) && o.屬性 === 我屬));
 const b = 清單.filter((o => 屬片(o) && 別人(o) && o.品質 === 我質 && o.屬性 !== 我屬)).sort(((p, q) => 屬序(p) - 屬序(q)));
 const c = 清單.filter((o => 別人(o) && o.屬性 === 我屬 && o.品質 === 我質)).sort(((p, q) => 屬片(q) - 屬片(p) || (p.編號 || 0) - (q.編號 || 0)));
 return (await 索引排("碎片", a, null, "同屬不同等") || "") + (await 索引排("碎片", b, null, "同等不同屬", null, null, true) || "") + (await 索引排("碎片", c, null, "同等同屬", null, null, true) || "");
}

let _兌 = null;

async function 兌換規則() {
 if (_兌 === null) _兌 = await fetch(window.素材基底 + "碎片/_兌換.json").then((r => r.ok ? r.json() : false)).catch((() => false));
 return _兌 || null;
}

const 階序 = [ "綠", "藍", "紫", "橙", "紅" ];

const 階名 = {
 "綠": "N",
 "藍": "R",
 "紫": "SR",
 "橙": "SSR",
 "紅": "UR"
};

async function 兌換板(x, 清單) {
 const R = await 兌換規則();
 if (!R) return "";
 const 質 = x.品質 || (x.類型 || {}).品質, 屬 = x.屬性, 種 = (x.類型 || {}).次類型編號;
 if (種 === 28) {
  const 可 = (清單 || []).filter((o => o.次類型編號 === 8 && o.品質 === 質));
  return (await 索引排("碎片", 可, null, "可以 1:1 換成同品質的任一個", null, null, true) || "") + `<p class="note">${esc((R.萬能卡轉換 || {}).做什麼 || "")}</p>`;
 }
 if (種 !== 89 && 種 !== 8) return '<p class="note">這一種不能兌換</p>';
 if (!屬) return '<p class="note">這一種不能兌換</p>';
 const 比 = (R.碎片兌換 || {}).比例 || {};
 const 鏈 = 階序.map((q => (清單 || []).find((o => o.次類型編號 === 89 && o.屬性 === 屬 && o.品質 === q)))).map(((o, i) => o ? {
  "品質": 階序[i],
  "名": o.名
 } : null));
 const 現 = 階序.indexOf(質);
 const 高 = Math.max(...鏈.map(((o, i) => o ? i : -1)));
 if (現 < 0 || 高 <= 現) return '<p class="note">已經是最高階,不能再往上換</p>';
 const 梯 = await 階梯板({
  "樣式": "拉桿",
  "鍵": "碎片兌換",
  "下限": 現,
  "上限": 高,
  "單位": "",
  "起始": 現,
  "目標": 高,
  "格式": v => {
   const o = 鏈[v];
   return o ? `${階名[o.品質]}·${屬}` : `${階名[階序[v]] || 階序[v]}·${屬}`;
  },
  "圖": v => {
   const o = 鏈[v];
   return o ? `<img src="${window.素材基底}碎片/${encodeURIComponent(o.名)}/圖.png" alt="">` : "";
  },
  "材料": [ {
   "類": "碎片",
   "名": x._名
  } ],
  "算": (a, b) => {
   const s2 = Math.min(a, b), e = Math.max(a, b);
   let 幾 = 1;
   for (let p = e; p > s2; p--) 幾 *= 比[階序[p]] || 1;
   return 幾 > 1 ? {
    [x._名]: 幾
   } : {};
  },
  "量格式": n => n >= 1e4 ? (n / 1e4).toFixed(2).replace(/\.?0+$/, "") + "萬" : String(n),
  "註": `換上去拿到的是**屬性碎片**,不是高一階的夥伴碎片。${(R.碎片兌換 || {}).材料可以是什麼 || ""}`
 });
 return 梯 || '<p class="note">不能兌換</p>';
}

 "分頁": async (x, 清單) => [ [ "資訊", rows([ [ "品質", x => x.品質 || (x.類型 || {}).品質 ], [ "屬性", x => x.屬性 ], [ "說明", x => x.說明 ], [ "等級上限", x => x.等級上限 ] ], x) + (x.是否可合成 && x.合成 && x.合成.合成為 ? await 名字排([ {
  "名": x.名稱,
  "量": x.合成.需要數量
 } ], "集滿") + await 名字排([ {
  "名": x.合成.合成為.名稱
 } ], "合成為") : "") + await 家族(x, 清單) ], [ "獲取", async () => await 獲取頁(x) || '<p class="note">尚未建檔</p>' ], [ "用途", async () => await 用途頁(x) || '<p class="note">沒有</p>' ], [ "兌換", () => 兌換板(x, 清單) ], [ "其他", rows([ [ "編號", x => x.編號 ], [ "對應圖像編號", x => x.對應圖像編號 ] ], x) ] ]
});</script></body></html>
