<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>碎片 · 巡夢圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../共用.css?v=202611231546">
</head><body><div class="page" id="app"></div>
<script src="../共用.js?v=202611231546"></script>
<script>
/* 碎片範本。**不帶任何資料** —— 全部執行時讀 素材/碎片/。
   外框(抬頭/分頁/挑選框/路由/事件)在 共用.js 的 開範本();
   引用一律走協議引擎,包括自己引用自己。 */

/* 碎片底下有四種(設定表 ItemDefine.sub_type):
     8   夥伴碎片   集滿合成那一個夥伴;屬性 = 該夥伴的 Retinue.character
     89  屬性碎片   突破用的通用碎片;屬性 = ItemDefine.base
     28  萬能卡     同品質任意屬性都能用 → 沒有屬性,不進家族
     251 殘頁       解鎖夢魘錄用 → 沒有屬性也沒有階,不進家族
   「等」一律看品質(屬性碎片 綠=N 藍=R 紫=SR 橙=SSR,跟夥伴碎片同一套),
   所以夥伴碎片和屬性碎片可以放在同一個「同等」裡面比。 */
const 五行序 = {金:1, 木:2, 水:3, 火:4, 土:5};
const 屬序 = o => 五行序[o.屬性] || 99;

async function 家族(x, 清單){
  const 我屬 = x.屬性, 我質 = (x.類型 || {}).品質 || x.品質, 我 = x._名;
  if(!我屬) return '';
  const 屬片 = o => o.次類型編號 === 89;          // 屬性碎片
  const 別人 = o => o.名 !== 我;

  /* 同屬不同等:同一個屬性的各階,只有屬性碎片(夥伴碎片是一人一種,沒有階可比)。 */
  const a = 清單.filter(o => 屬片(o) && 別人(o) && o.屬性 === 我屬);
  /* 同等不同屬:同一階的其他屬性,一樣只有屬性碎片;照金木水火土排。 */
  const b = 清單.filter(o => 屬片(o) && 別人(o) && o.品質 === 我質 && o.屬性 !== 我屬)
                .sort((p, q) => 屬序(p) - 屬序(q));
  /* 同等同屬:同一階、同一個屬性的全部,**含夥伴碎片**
     (遊戲配碎片時夥伴碎片比的就是 character,跟屬性碎片的 base 同一組編號)。
     屬性碎片排前面,夥伴碎片照編號跟在後面。 */
  const c = 清單.filter(o => 別人(o) && o.屬性 === 我屬 && o.品質 === 我質)
                .sort((p, q) => (屬片(q) - 屬片(p)) || ((p.編號 || 0) - (q.編號 || 0)));

  return (await 索引排('碎片', a, null, '同屬不同等') || '')
       + (await 索引排('碎片', b, null, '同等不同屬', null, null, true) || '')
       + (await 索引排('碎片', c, null, '同等同屬',   null, null, true) || '');
}

/* 兌換:規則在 素材/碎片/_兌換.json(全碎片共用一張,範本不帶資料)。
   屬性碎片可以用「低一品質、同五行」的碎片換上來 —— 材料可以是夥伴碎片也可以是屬性碎片。
   夥伴碎片則是萬能卡 1:1 轉過來的。 */
let _兌 = null;
async function 兌換規則(){
  if(_兌 === null)
    _兌 = await fetch(window.素材基底 + '碎片/_兌換.json').then(r => r.ok ? r.json() : false).catch(() => false);
  return _兌 || null;
}
const 階序 = ['綠', '藍', '紫', '橙', '紅'];
const 階名 = {綠:'N', 藍:'R', 紫:'SR', 橙:'SSR', 紅:'UR'};

/* 兌換:跟裝備/寶石同一套雙拉桿(使用者 2026-11-16:「所有碎片的頁面都要加一個兌換 tab」)。
   規則在 素材/碎片/_兌換.json —— 拿**低一品質、同一個五行**的碎片換上來,
   比例的鍵是**目標品質**(藍 5、紫 5、橙 15),所以一路換上去是逐段相乘。
   材料可以是屬性碎片,也可以是同五行同品質的夥伴碎片 —— 格子畫屬性碎片那一張當代表。 */
async function 兌換板(x, 清單){
  const R = await 兌換規則();
  if(!R) return '';
  const 質 = x.品質 || (x.類型 || {}).品質, 屬 = x.屬性, 種 = (x.類型 || {}).次類型編號;

  if(種 === 28){                       // 萬能卡:1:1 轉成同品質的夥伴碎片
    const 可 = (清單 || []).filter(o => o.次類型編號 === 8 && o.品質 === 質);
    /* 不用再畫一次自己 —— 這就是它自己的頁面(使用者 2026-11-16) */
    return (await 索引排('碎片', 可, null, '可以 1:1 換成同品質的任一個', null, null, true) || '')
      + `<p class="note">${esc((R.萬能卡轉換 || {}).做什麼 || '')}</p>`;
  }
  if(種 !== 89 && 種 !== 8) return '<p class="note">這一種不能兌換</p>';
  if(!屬) return '<p class="note">這一種不能兌換</p>';

  const 比 = (R.碎片兌換 || {}).比例 || {};
  /* 產物一律是**屬性碎片** —— 夥伴碎片換上去也是拿到高一階的屬性碎片,
     不會變成高一階的夥伴碎片(使用者 2026-11-16 特別提醒的)。 */
  const 鏈 = 階序.map(q => (清單 || []).find(o => o.次類型編號 === 89 && o.屬性 === 屬 && o.品質 === q))
    .map((o, i) => o ? {品質: 階序[i], 名: o.名} : null);
  const 現 = 階序.indexOf(質);
  const 高 = Math.max(...鏈.map((o, i) => o ? i : -1));
  /* 不能降級,起點就是手上這一個的品質 */
  if(現 < 0 || 高 <= 現) return '<p class="note">已經是最高階,不能再往上換</p>';

  const 梯 = await 階梯板({
    樣式: '拉桿', 鍵: '碎片兌換', 下限: 現, 上限: 高, 單位: '',
    起始: 現, 目標: 高,
    格式: v => { const o = 鏈[v];
      return o ? `${階名[o.品質]}·${屬}` : `${階名[階序[v]] || 階序[v]}·${屬}`; },
    圖: v => { const o = 鏈[v];
      return o ? `<img src="${window.素材基底}碎片/${encodeURIComponent(o.名)}/圖.png" alt="">` : ''; },
    /* 材料只有手上這一個 —— 起點固定,不會換成別張 */
    材料: [{類:'碎片', 名:x._名}],
    算: (a, b) => {
      const s2 = Math.min(a, b), e = Math.max(a, b);
      let 幾 = 1;
      for(let p = e; p > s2; p--) 幾 *= (比[階序[p]] || 1);
      return 幾 > 1 ? {[x._名]: 幾} : {};
    },
    量格式: n => n >= 1e4 ? (n / 1e4).toFixed(2).replace(/\.?0+$/, '') + '萬' : String(n),
    註: `換上去拿到的是**屬性碎片**,不是高一階的夥伴碎片。${
      (R.碎片兌換 || {}).材料可以是什麼 || ''}`,
  });
  return 梯 || '<p class="note">不能兌換</p>';
}

開範本({
  類別: '碎片',
  副標: x => [x.等級名稱, x.屬性 ? x.屬性 + ' 屬性' : null],
  分頁: async (x, 清單) => [
    ['資訊', rows([
      ['品質', x => x.品質 || (x.類型 || {}).品質],
      ['屬性', x => x.屬性],
      ['說明', x => x.說明],
      ['等級上限', x => x.等級上限],
    ], x)
      /* 合成為不一定是夥伴(裝備碎片合成裝備),所以名字丟給 名字排() 去索引對類別。
         要幾片疊在格子上,不另外寫一行字。 */
      + (x.是否可合成 && x.合成 && x.合成.合成為
          ? await 名字排([{名: x.名稱, 量: x.合成.需要數量}], '集滿')
            + await 名字排([{名: x.合成.合成為.名稱}], '合成為')
          : '')
      + await 家族(x, 清單)],
    ['獲取', async () => (await 獲取頁(x)) || '<p class="note">尚未建檔</p>'],
    ['兌換', () => 兌換板(x, 清單)],
    ['其他', rows([
      ['編號',         x => x.編號],
      ['對應圖像編號', x => x.對應圖像編號],
      ['請求獲取指令', x => (x.請求獲取指令 || {}).範例 || (x.請求獲取指令 || {}).格式],
      ['資料來源',     x => x.資料來源],
      ['產生時間',     x => x.產生時間],
      ['素材路徑',     x => '素材/碎片/' + x._名],
    ], x)],
  ],
});
</script></body></html>
