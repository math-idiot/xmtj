ata-b=\"\" data-c=\"[&quot;../../素材/道具/%E6%95%85%E5%A4%A2%E7%8E%89%E9%8F%A1/圖.png&quot;]\" data-f=\"\" onerror=\"快圖退(this)\"><span class=\"ov num\">0<\/span><\/span><b>故夢玉鏡<\/b><\/a>","{\"類\":\"道具\",\"名\":\"明心寶鏡\",\"量\":0,\"顯名\":true}":"<a class=\"obj\" href=\"../道具/%E6%98%8E%E5%BF%83%E5%AF%B6%E9%8F%A1.html\" title=\"鏡面澄澈，照見的不止容顏，還有被遺忘的本心，是心途升級的材料。\"><span class=\"rfi\" style=\"background-image:url('../../素材/介面/品質框/品質框_05_橙.png')\"><img style=\"-webkit-mask-image:url('../../素材/介面/格子零件/格遮罩.png');mask-image:url('../../素材/介面/格子零件/格遮罩.png')\" src=\"../../素材/道具/%E6%98%8E%E5%BF%83%E5%AF%B6%E9%8F%A1/圖.png\" alt=\"\" loading=\"lazy\" data-b=\"\" data-c=\"[&quot;../../素材/道具/%E6%98%8E%E5%BF%83%E5%AF%B6%E9%8F%A1/圖.png&quot;]\" data-f=\"\" onerror=\"快圖退(this)\"><span class=\"ov num\">0<\/span><\/span><b>明心寶鏡<\/b><\/a>"},"零件":{"格遮罩":"../../素材/介面/格子零件/格遮罩.png","寶石孔底":"../../素材/介面/格子零件/寶石孔底.png","珍寶等級底":"../../素材/介面/格子零件/珍寶等級底.png"},"名":"沈濟安"};</script>
<script src="../共用.js"></script>
<script>
/* 夥伴範本。**不帶任何資料** —— 全部執行時讀 素材/夥伴/。
   外框(抬頭/分頁/挑選框/路由/事件)在 共用.js 的 開範本();
   引用一律走協議引擎,包括自己引用自己。

   這張以前不存在 —— 協議的 連結 指著它,HEAD 探測失敗,所以全站的夥伴格子
   都降級成不可點的 span(使用者 2026-11-16:「有夥伴的地方要用引用」)。 */

/* 素材/夥伴/_索引.json 有 245 筆,其中 204 筆是 傳記/劇情 的子項(沒有編號),
   夥伴本體只有 41 筆。家族只在本體裡面比。 */
const 錢 = n => {
  const 單 = (v, u) => v.toFixed(2).replace(/\.?0+$/, '') + u;
  if(n >= 1e8) return 單(n / 1e8, '億');
  if(n >= 1e4) return 單(n / 1e4, '萬');
  return String(n);
};
const 本體 = 清單 => (清單 || []).filter(o => o.編號 != null);

/* 稀有度由低到高,家族要照這個排(使用者:「有出現一整組的東西就是稀有度從低排到高」) */
const 階序 = {N:1, R:2, SR:3, SSR:4, UR:5};
const 五行序 = {金:1, 木:2, 水:3, 火:4, 土:5};
async function 家族(x, 清單){
  const 我 = x._名, 屬 = x.屬性, 階 = x.稀有度;
  if(!屬 && !階) return '';
  const 別人 = o => o.名 !== 我;
  /* 同屬不同等:同一個五行的各階。五行是 Retinue.character,跟屬性碎片的 base 同一組編號。 */
  const a = 本體(清單).filter(o => 別人(o) && o.屬性 === 屬)
              .sort((p, q) => (階序[p.稀有度] || 9) - (階序[q.稀有度] || 9));
  /* 同等不同屬:同一階的其他五行,照金木水火土。 */
  const b = 本體(清單).filter(o => 別人(o) && o.稀有度 === 階 && o.屬性 !== 屬)
              .sort((p, q) => (五行序[p.屬性] || 9) - (五行序[q.屬性] || 9));
  const [A, B] = await Promise.all([索引排('夥伴', a, null, '同屬不同等', null, null, true),
                                    索引排('夥伴', b, null, '同等不同屬', null, null, true)]);
  return (A || '') + (B || '');
}

/* 每個夥伴都有自己的碎片。名字**不能用「夥伴名+碎片」拼** ——
   囚光烏照 的碎片叫「烏照碎片」(使用者 2026-11-16:「又有引用問題」)。
   權威來源是 ItemDefine sub_type 8(heropatch)的 extend 欄綁回夥伴 rid,
   已回填進 素材/夥伴/<名>/資料.json 的 碎片 欄(41/41 都有)。 */
async function 碎片格(x){
  const f = x.碎片 && x.碎片.名稱; if(!f) return '';
  return await 名字排([f], '碎片') || '';
}

/* kv() 會把「鍵」整個 esc 掉,所以鍵只能放純文字,樣式寫在值裡。 */
function 技能板(x){
  const a = x.技能 || [];
  if(!a.length) return '';
  return `<div class="rows">${a.map(s => kv(
    s.名稱 + (s.解鎖階 ? `(${s.解鎖階} 階)` : ''),
    `<span class="kind">${esc(s.類型 || '')}</span> ` + rich(s.說明 || '')
  )).join('')}</div>`;
}

/* 好感獎勵的「獎勵」欄是「夥伴經驗×1000」這種一串 —— 名字排() 會拆成引用 + 數量,
   拆不開或素材沒建檔的就自己降級成文字,這裡不用再防一次。 */
async function 好感板(x){
  const a = x.好感獎勵 || [];
  if(!a.length) return '';
  const 梯 = await 好感梯(x, a);
  /* 好感tab已是拉桿,底下「每一階給什麼」的表格拿掉(使用者 2026-11-17:拉桿已涵蓋,表格不需要)。 */
  return 梯;
}

/* 好感也用那一套雙頭拉桿(使用者 2026-11-16:「我發現夥伴好感也可以做成這個模式」)。
   跟升級/突破不同的是:這裡算的是**拿到什麼**,不是要花什麼,所以 料標 寫「拿到」。
   拉桿的刻度是第幾筆獎勵,畫出來的一律是那一筆的**好感度門檻**。
   圖示是遊戲自己那顆粉紅愛心 assets/arts/ui/img/expert/hgd_icon_xin.png
   (使用者 2026-11-16 指認;好友系統那幾顆橘的綠的是別套系統,沒收進素材)。 */
async function 好感梯(x, a){
  const 拆 = t => { const m = /^(.+?)[×x]\s*([\d,]+)$/.exec(String(t || '').trim());
    return m ? [m[1].trim(), +m[2].replace(/,/g, '')] : [String(t || '').trim(), 1]; };
  const 項 = r => String(r.獎勵 || '').split(/[、,，]/).map(t => t.trim()).filter(Boolean).map(拆);
  const 名單 = [...new Set(a.flatMap(r => 項(r).map(c => c[0])))];
  /* 獎勵欄的名字跟素材的名字不一定一樣(「表情「別跑！」」在素材是 貼圖/別跑！)。
     先對一次,之後 算() 一律用**對到的名字**當鍵 —— 不然格子上的數字永遠是 0。 */
  const 查 = await Promise.all(名單.map(n => 找物(n)));
  const 對 = {}, 格料 = [];
  名單.forEach((n, i) => { const h = 查[i];
    if(h && h.類){ 對[n] = h.名; 格料.push({類: h.類, 名: h.名}); } });
  return await 階梯板({
    樣式: '拉桿',
    鍵: '夥伴好感', 下限: 0, 上限: a.length, 單位: '好感', 起始: 0, 目標: a.length,
    圖: () => `<img src="${window.素材基底}介面/好感/hgd_icon_xin.png" alt="">`,
    格式: v => v <= 0 ? 0 : a[v - 1].好感度,
    材料: 格料,
    算: (p, q) => { const 需 = {};
      for(let i = p; i < q; i++) for(const [n, v] of 項(a[i])){
        const k = 對[n] || n; 需[k] = (需[k] || 0) + v; }
      return 需; },
    量格式: 錢,
    料標: '拿到',
  });
}

/* ── 養成:升級 / 突破 / 升星 / 心途 ────────────────────────────
   使用者 2026-11-16:「升級/心途/突破的用跟裝備同一套互動式的,不要用表格」
   「突破/升級純計算耗材用途,不需要顯示當前效果/傷害等等參數」。
   所以這四頁只算「從 a 到 b 要花什麼」,不列屬性成長。

   規則全部在 素材/夥伴/_升級.json / _突破.json / _升星.json / _心途.json,
   範本不帶任何數字。 */
const _規 = {};
async function 規則(名){
  if(_規[名] === undefined)
    _規[名] = await fetch(window.素材基底 + '夥伴/_' + 名 + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
  return _規[名];
}
/* 把一串 {名:量} 累加起來 */
const _加 = (到, 從) => { for(const k in 從) 到[k] = (到[k] || 0) + 從[k]; return 到; };
/* 材料清單 → 引用用的 [{類,名}];名字丟給索引對類別,不硬塞 */
async function _料格(名單){
  /* 對不到素材的直接不給格子 —— 階梯板 也會再濾一次 */
  const h = await Promise.all(名單.map(n => 找物(n)));
  return 名單.map((n, i) => h[i] && h[i].類 ? {類:h[i].類, 名:h[i].名} : null).filter(Boolean);
}

async function 升級板(x){
  const r = await 規則('升級');
  if(!r) return '';
  /* 上限照**遊戲的表**走,不是照某個帳號現在能練到哪
     (使用者 2026-11-16:「所有的最高等級都不要照我的最高等級,遊戲到哪裡你就坐到哪裡」)。
     數字讀 _升級.json 的 等級範圍,範本不帶數字。 */
  const 上 = (r.等級範圍 || [1, r.每級經驗.length])[1];
  const 名單 = ['夥伴經驗', ...new Set(r.改吃材料的級.filter(Boolean).flatMap(o => Object.keys(o)))];
  const _梯=await 階梯板({
    /* 2026-11-16:先只有這一頁改成雙頭拉桿,給使用者看過再決定要不要套到全部 */
    樣式: '拉桿',
    鍵: '夥伴升級', 下限: 1, 上限: 上, 單位: '級', 起始: 1, 目標: 上,
    材料: await _料格(名單),
        /* 遊戲裡等級就是寫成「Lv.130」的文字,沒有獨立圖示(使用者 2026-11-16 的截圖) */
    圖: v => `<span class="txt">Lv.${v}</span>`,
    /* 那一級有材料就只吃材料、不吃經驗 —— 照程式走,不是拿累計經驗相減 */
    算: (a, b) => { const 需 = {};
      for(let i = a; i < b; i++){
        const m = r.改吃材料的級[i - 1];
        if(m) _加(需, m); else 需.夥伴經驗 = (需.夥伴經驗 || 0) + r.每級經驗[i - 1];
      }
      return 需; },
    量格式: 錢,
  });
  return _梯 + await 心醫上限板('夥伴升級上限');
}

async function 突破板(x){
  const r = await 規則('突破'); const me = r && r.夥伴[String(x.id)];
  if(!me) return '';
  const 名單 = [...new Set(me.各階.flatMap(s => s.材料.map(m => m.種類 === '同名碎片' ? m.名稱 : m.代表)))];
  const _梯=await 階梯板({
    樣式: '拉桿',
    鍵: '夥伴突破', 下限: 0, 上限: me.上限, 單位: '階', 起始: 0, 目標: me.上限,
    圖: () => `<span class="txt">突破</span>`,
    材料: await _料格(名單),
    算: (a, b) => { const 需 = {};
      for(const s of me.各階) if(s.階 > a && s.階 <= b)
        for(const m of s.材料) 需[m.種類 === '同名碎片' ? m.名稱 : m.代表] =
          (需[m.種類 === '同名碎片' ? m.名稱 : m.代表] || 0) + m.數量;
      return 需; },
    量格式: 錢,
  });
  return _梯 + 心醫門檻板((r.心醫門檻)||[], '突破');
}

async function 升星板(x){
  const r = await 規則('升星'); const me = r && r.夥伴[String(x.id)];
  if(!me) return '';
  const 名單 = [...new Set(me.各階.flatMap(s => s.升到下一階要.map(m => m.名稱)))];
  const 梯 = await 階梯板({
    樣式: '拉桿',
    鍵: '夥伴升星', 下限: 0, 上限: me.上限, 單位: '星', 起始: 0, 目標: me.上限,
    /* 升星的圖示是那把五瓣扇。**每 5 星一層**,第 6 星起換一層的造型 ——
       原始碼 ExpertToolMgr.SetAwakeImgStar 用 starFloor = ceil(星/5),
       const.ExpertAwakeStarFloorNum = 5(使用者 2026-11-16:「滿六之後是不一樣造型」)。
       xingji0N = 第一層(金)、xingji1N = 第二層(粉)、xingji2N = 還沒點亮。 */
    /* 花瓣依序亮:1 星亮 1 瓣,以此類推(使用者 2026-11-16)。
       規則寫在 共用.js 的 扇形(),照原始碼 SetAwakeImgStar 來。 */
    圖: v => 扇形(v, me.上限),
    材料: await _料格(名單),
    /* need 寫在「目前星數」那一列,所以區間是 a..b-1 */
    算: (a, b) => { const 需 = {};
      for(const s of me.各階) if(s.階 >= a && s.階 < b)
        for(const m of s.升到下一階要) 需[m.名稱] = (需[m.名稱] || 0) + m.數量;
      return 需; },
    量格式: 錢,
  });
  /* 升星真正顯示的是**百分比**,而且照「SSR / SSR限定 / UR限定」分組
     (使用者 2026-11-16:「他其實是趴數…每一種不一樣等級的夥伴他的趴數不一樣」)。
     設定表只有逐夥伴的萬分比,分組是使用者自己歸納的,存在 _升星.json。
     固定值(攻擊+440 那種)才是逐夥伴各自不同,放在底下當附帶。 */
  const 百 = me.每階百分比 || [];
  const 固 = me.各階.filter(s => (s.這一階給的 || []).length);
  return 梯 + 心醫門檻板((r.心醫門檻)||[], '升星')
    + (百.length ? `<h3 class="grp">升星加成</h3>${
        me.效果分組 ? `<p class="note">${esc(me.效果分組)} 這一組都一樣</p>` : ''}
       <table class="aff"><tbody>${百.map(g =>
       `<tr><td>${esc(String(g.適用階 || '').replace(/階/g, '星'))}</td><td>${
          esc(g.效果原文 || '')}</td></tr>`).join('')}</tbody></table>` : '')
    + (固.length ? `<h3 class="grp">另外加的固定值</h3>
       <p class="note">這一段每個夥伴都不一樣,是累計值不是每階增量。</p>
       <table class="aff"><thead><tr><th>星</th><th>屬性</th></tr></thead><tbody>${固.map(s =>
       `<tr><td>${s.階}</td><td>${esc((s.這一階給的 || []).map(a =>
          a.屬性 + '+' + a.值 + (a.單位 === '點' ? '' : a.單位)).join('、'))}</td></tr>`).join('')
       }</tbody></table>` : '');
}

async function 心途板(x){
  const r = await 規則('心途'); const m = r && x.心途模型 && r.模型[String(x.心途模型)];
  if(!m) return '<p class="note">這位沒有心途</p>';
  const 全 = m.節點, 上 = 全.length;
  const 名單 = [...new Set(全.flatMap(o => Object.keys(o.材料)))];
  /* 使用者 2026-11-16:「這邊只需要顯示幾階幾級到幾階幾級,不用那個點數」。
     所以節點序號只拿來當拉桿的刻度,畫出來的一律是「N 階 M 級」。 */
  const 階級 = v => v <= 0 ? '1 階 0 級'
    : `${Math.ceil(v / 30)} 階 ${v - (Math.ceil(v / 30) - 1) * 30} 級`;
  const 梯 = await 階梯板({
    樣式: '拉桿',
    鍵: '夥伴心途', 下限: 0, 上限: 上, 單位: '', 起始: 0, 目標: 上,
    材料: await _料格(名單), 格式: 階級,
    /* 數字大、國字小 —— 跟升級/升星那幾頁一致(使用者 2026-11-16) */
    格式H: v => { const 階 = v <= 0 ? 1 : Math.ceil(v / 30);
      const 級 = v <= 0 ? 0 : v - (階 - 1) * 30;
      return `${階}<i>階</i>${級}<i>級</i>`; },
    /* 心途每一階有自己的圖示(RetinueTrain.icon = xintu_icon_N),拉到哪一階就換哪一張 */
    圖: v => {
      const o = 全.find(n => n.節點 === Math.max(1, v)) || 全[0];
      return o && o.圖示
        ? `<img src="${window.素材基底}介面/心途/${o.圖示}.png" alt="">` : '';
    },
    算: (a, b) => { const 需 = {};
      for(const o of 全) if(o.節點 > a && o.節點 <= b) _加(需, o.材料);
      return 需; },
  });
  const 共 = ((r.心途共鳴 || {}).各級 || []).filter(o => o.等級 > 0);
  return 梯 + (共.length
    ? `<h3 class="grp">心途共鳴</h3><div class="rows">${共.map(o =>
        kv(o.等級 + ' 級', esc(o.條件 || ''))).join('')}</div>
       <p class="note">全夥伴共用一個等級,不分五行也不分夥伴。</p>`
    : '');
}

/* 技能:表格。列出各技能在哪一階提升、那一階的效果。
   使用者 2026-11-16:「技能要改,用表格,列出各技提升節點和技能效果」。 */
function 技能表(x){
  const a0 = x.技能 || [];
  if(!a0.length) return '';
  /* UR 常常有好幾支同名的被動,編號不一樣但升階時一起升、文字也完全一樣
     (使用者自己的筆記:「UR 多半有三個被動,升階時一起升」)。
     同名又同階梯的合併成一條,右邊標幾個,不要畫三張一模一樣的表。 */
  const 併 = new Map();
  for(const s of a0){
    const k = s.名稱 + '|' + JSON.stringify((s.階梯 || []).map(n => [n.階, n.技能等級, n.節點效果]));
    if(併.has(k)) 併.get(k).份++; else 併.set(k, Object.assign({份:1}, s));
  }
  const a = [...併.values()];
  return a.map(s => {
    const 梯 = s.階梯 || [];
    /* 圖示跟名字排同一條水平線(使用者 2026-11-16 的草圖)。
       圖還沒進素材,所以探不到就只畫名字,不留空洞。 */
    const 圖 = s.圖 ? `<img class="skico" src="${window.素材基底}夥伴/${
        encodeURIComponent(x._名)}/技能/${encodeURIComponent(s.圖)}.png" alt="">` : '';
    return `<h3 class="grp skrow">${圖}<span>${esc(s.名稱)}${
        s.份 > 1 ? ` ×${s.份}` : ''}</span></h3>`
      + `<p class="note">${esc([s.類型台版字串 || s.類型, s.定位].filter(Boolean).join(' · '))}${
          s.份 > 1 ? ` · 同時有 ${s.份} 個,升階時一起升` : ''}</p>`
      + (梯.length
        ? `<table class="aff"><thead><tr><th>突破階</th><th>技能等級</th><th>效果</th></tr></thead><tbody>${
            梯.map(n => `<tr><td>${n.階}</td><td>${n.技能等級}</td><td>${rich(n.節點效果 || '')}</td></tr>`).join('')
          }</tbody></table>`
        : `<p class="desc">${rich(s.說明 || '')}</p>`);
  }).join('');
}

開範本({
  類別: '夥伴',
  /* 引用格用大頭照,這張抬頭用全身立繪(使用者 2026-11-16)。兩個都走協議的圖樣式。 */
  抬頭樣式: '全身',
  /* 副標不要品質顏色(紫/橙/紅)—— 夥伴一律用 N/R/SR/SSR/UR,限定的再加「限定」
     (使用者 2026-11-16:「夥伴的等級顯示要改成用 n/r/sr/ssr/ur 不能用顏色,或是 SSR · 限定 這樣」)。 */
  副標不帶品質: true,
  副標: x => [x.稀有度, x.限定 ? '限定' : null, x.稱號, x.屬性],
  分頁: async (x, 清單) => [
    ['資訊', rows([
      ['稱號',     x => x.稱號],
      ['稀有度',   x => x.稀有度 + (x.限定 ? ' · 限定' : '')],
      ['屬性',     x => x.屬性],
      ['職業類型', x => x.職業類型],
      ['定位',     x => x.定位],
      ['突破上限', x => x.突破上限],
      ['可覺醒',   x => x.可覺醒 === true ? '是' : (x.可覺醒 === false ? '否' : null)],
      ['心途上限', x => x.心途上限],
      /* 屬性是「基礎 + 成長」兩個數,攤成一行 */
      ['攻擊', x => x.攻擊 ? `基礎 ${x.攻擊.基礎} · 成長 ${x.攻擊.成長}` : null],
      ['防禦', x => x.防禦 ? `基礎 ${x.防禦.基礎} · 成長 ${x.防禦.成長}` : null],
      ['氣勢', x => x.氣勢 ? `基礎 ${x.氣勢.基礎} · 成長 ${x.氣勢.成長}` : null],
      ['星座', x => x.星座],
      ['生日', x => x.生日],
      ['血型', x => x.血型],
      ['年齡', x => x.年齡],
    ], x)
      + 延後(碎片格(x))          // 先把抬頭和基本資料畫出來,這兩塊算好再填(2026-11-22)
      + 延後(家族(x, 清單))],
    ['介紹', x.介紹 ? `<p class="desc">${rich(String(x.介紹)).replace(/\n/g, '<br>')}</p>`
                   : '<p class="note">沒有</p>'],
    ['獲取', async () => (await 獲取頁(x)) || '<p class="note">尚未建檔</p>'],
    ['技能', 技能表(x) || '<p class="note">沒有</p>'],
    /* 分頁內容給函式 = 切過去才算(共用.js 的 填頁),不然一進頁就要抓四個規則檔 */
    ['升級', () => 升級板(x)],
    ['突破', () => 突破板(x)],
    ...(x.升星上限 ? [['升星', () => 升星板(x)]] : []),
    ['心途', () => 心途板(x)],
    ['好感', async () => (await 好感板(x)) || '<p class="note">沒有</p>'],
    ['其他', rows([
      ['編號',     x => x.id ?? x.編號],
      ['傳記章數', x => x.傳記章數],
      ['請求獲取指令', x => (x.請求獲取指令 || {}).格式],
      ['資料來源', x => x.資料來源],
      ['產生時間', x => x.產生時間],
      ['素材路徑', x => '素材/夥伴/' + x._名],
    ], x)],
  ],
});
</script></body></html>
