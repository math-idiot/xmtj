<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>夥伴 · 巡夢圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../共用.css?v=202611232014">
</head><body><div class="page" id="app"></div>
<script src="../共用.js?v=202611232014"></script>
<script>const 錢 = n => {
 const 單 = (v, u) => v.toFixed(2).replace(/\.?0+$/, "") + u;
 if (n >= 1e8) return 單(n / 1e8, "億");
 if (n >= 1e4) return 單(n / 1e4, "萬");
 return String(n);
};

const 本體 = 清單 => (清單 || []).filter((o => o.編號 != null));

const 階序 = {
 N: 1,
 R: 2,
 SR: 3,
 SSR: 4,
 UR: 5
};

const 五行序 = {
 "金": 1,
 "木": 2,
 "水": 3,
 "火": 4,
 "土": 5
};

async function 家族(x, 清單) {
 const 我 = x._名, 屬 = x.屬性, 階 = x.稀有度;
 if (!屬 && !階) return "";
 const 別人 = o => o.名 !== 我;
 const a = 本體(清單).filter((o => 別人(o) && o.屬性 === 屬)).sort(((p, q) => (階序[p.稀有度] || 9) - (階序[q.稀有度] || 9)));
 const b = 本體(清單).filter((o => 別人(o) && o.稀有度 === 階 && o.屬性 !== 屬)).sort(((p, q) => (五行序[p.屬性] || 9) - (五行序[q.屬性] || 9)));
 const [A, B] = await Promise.all([ 索引排("夥伴", a, null, "同屬不同等", null, null, true), 索引排("夥伴", b, null, "同等不同屬", null, null, true) ]);
 return (A || "") + (B || "");
}

async function 碎片格(x) {
 const f = x.碎片 && x.碎片.名稱;
 if (!f) return "";
 return await 名字排([ f ], "碎片") || "";
}

function 技能板(x) {
 const a = x.技能 || [];
 if (!a.length) return "";
 return `<div class="rows">${a.map((s => kv(s.名稱 + (s.解鎖階 ? `(${s.解鎖階} 階)` : ""), `<span class="kind">${esc(s.類型 || "")}</span> ` + rich(s.說明 || "")))).join("")}</div>`;
}

async function 好感板(x) {
 const a = x.好感獎勵 || [];
 if (!a.length) return "";
 const 梯 = await 好感梯(x, a);
 return 梯;
}

async function 好感梯(x, a) {
 const 拆 = t => {
  const m = /^(.+?)[×x]\s*([\d,]+)$/.exec(String(t || "").trim());
  return m ? [ m[1].trim(), +m[2].replace(/,/g, "") ] : [ String(t || "").trim(), 1 ];
 };
 const 項 = r => String(r.獎勵 || "").split(/[、,，]/).map((t => t.trim())).filter(Boolean).map(拆);
 const 名單 = [ ...new Set(a.flatMap((r => 項(r).map((c => c[0]))))) ];
 const 查 = await Promise.all(名單.map((n => 找物(n))));
 const 對 = {}, 格料 = [];
 名單.forEach(((n, i) => {
  const h = 查[i];
  if (h && h.類) {
   對[n] = h.名;
   格料.push({
    "類": h.類,
    "名": h.名
   });
  }
 }));
 return await 階梯板({
  "樣式": "拉桿",
  "鍵": "夥伴好感",
  "下限": 0,
  "上限": a.length,
  "單位": "好感",
  "起始": 0,
  "目標": a.length,
  "圖": () => `<img src="${window.素材基底}介面/好感/hgd_icon_xin.png" alt="">`,
  "格式": v => v <= 0 ? 0 : a[v - 1].好感度,
  "材料": 格料,
  "算": (p, q) => {
   const 需 = {};
   for (let i = p; i < q; i++) for (const [n, v] of 項(a[i])) {
    const k = 對[n] || n;
    需[k] = (需[k] || 0) + v;
   }
   return 需;
  },
  "量格式": 錢,
  "料標": "拿到"
 });
}

const _規 = {};

async function 規則(名) {
 if (_規[名] === undefined) _規[名] = await fetch(window.素材基底 + "夥伴/_" + 名 + ".json").then((r => r.ok ? r.json() : null)).catch((() => null));
 return _規[名];
}

const _加 = (到, 從) => {
 for (const k in 從) 到[k] = (到[k] || 0) + 從[k];
 return 到;
};

async function _料格(名單) {
 const h = await Promise.all(名單.map((n => 找物(n))));
 return 名單.map(((n, i) => h[i] && h[i].類 ? {
  "類": h[i].類,
  "名": h[i].名
 } : null)).filter(Boolean);
}

async function 升級板(x) {
 const r = await 規則("升級");
 if (!r) return "";
 const 上 = (r.等級範圍 || [ 1, r.每級經驗.length ])[1];
 const 名單 = [ "夥伴經驗", ...new Set(r.改吃材料的級.filter(Boolean).flatMap((o => Object.keys(o)))) ];
 const _梯 = await 階梯板({
  "樣式": "拉桿",
  "鍵": "夥伴升級",
  "下限": 1,
  "上限": 上,
  "單位": "級",
  "起始": 1,
  "目標": 上,
  "材料": await _料格(名單),
  "圖": v => `<span class="txt">Lv.${v}</span>`,
  "算": (a, b) => {
   const 需 = {};
   for (let i = a; i < b; i++) {
    const m = r.改吃材料的級[i - 1];
    if (m) _加(需, m); else 需.夥伴經驗 = (需.夥伴經驗 || 0) + r.每級經驗[i - 1];
   }
   return 需;
  },
  "量格式": 錢
 });
 return _梯 + await 心醫上限板("夥伴升級上限");
}

async function 突破板(x) {
 const r = await 規則("突破");
 const me = r && r.夥伴[String(x.id)];
 if (!me) return "";
 const 名單 = [ ...new Set(me.各階.flatMap((s => s.材料.map((m => m.種類 === "同名碎片" ? m.名稱 : m.代表))))) ];
 const _梯 = await 階梯板({
  "樣式": "拉桿",
  "鍵": "夥伴突破",
  "下限": 0,
  "上限": me.上限,
  "單位": "階",
  "起始": 0,
  "目標": me.上限,
  "圖": () => `<span class="txt">突破</span>`,
  "材料": await _料格(名單),
  "算": (a, b) => {
   const 需 = {};
   for (const s of me.各階) if (s.階 > a && s.階 <= b) for (const m of s.材料) 需[m.種類 === "同名碎片" ? m.名稱 : m.代表] = (需[m.種類 === "同名碎片" ? m.名稱 : m.代表] || 0) + m.數量;
   return 需;
  },
  "量格式": 錢
 });
 return _梯 + 心醫門檻板(r.心醫門檻 || [], "突破");
}

async function 升星板(x) {
 const r = await 規則("升星");
 const me = r && r.夥伴[String(x.id)];
 if (!me) return "";
 const 名單 = [ ...new Set(me.各階.flatMap((s => s.升到下一階要.map((m => m.名稱))))) ];
 const 梯 = await 階梯板({
  "樣式": "拉桿",
  "鍵": "夥伴升星",
  "下限": 0,
  "上限": me.上限,
  "單位": "星",
  "起始": 0,
  "目標": me.上限,
  "圖": v => 扇形(v, me.上限),
  "材料": await _料格(名單),
  "算": (a, b) => {
   const 需 = {};
   for (const s of me.各階) if (s.階 >= a && s.階 < b) for (const m of s.升到下一階要) 需[m.名稱] = (需[m.名稱] || 0) + m.數量;
   return 需;
  },
  "量格式": 錢
 });
 const 百 = me.每階百分比 || [];
 const 固 = me.各階.filter((s => (s.這一階給的 || []).length));
 return 梯 + 心醫門檻板(r.心醫門檻 || [], "升星") + (百.length ? `<h3 class="grp">升星加成</h3>${me.效果分組 ? `<p class="note">${esc(me.效果分組)} 這一組都一樣</p>` : ""}\n       <table class="aff"><tbody>${百.map((g => `<tr><td>${esc(String(g.適用階 || "").replace(/階/g, "星"))}</td><td>${esc(g.效果原文 || "")}</td></tr>`)).join("")}</tbody></table>` : "") + (固.length ? `<h3 class="grp">另外加的固定值</h3>\n       <p class="note">這一段每個夥伴都不一樣,是累計值不是每階增量。</p>\n       <table class="aff"><thead><tr><th>星</th><th>屬性</th></tr></thead><tbody>${固.map((s => `<tr><td>${s.階}</td><td>${esc((s.這一階給的 || []).map((a => a.屬性 + "+" + a.值 + (a.單位 === "點" ? "" : a.單位))).join("、"))}</td></tr>`)).join("")}</tbody></table>` : "");
}

async function 心途板(x) {
 const r = await 規則("心途");
 const m = r && x.心途模型 && r.模型[String(x.心途模型)];
 if (!m) return '<p class="note">這位沒有心途</p>';
 const 全 = m.節點, 上 = 全.length;
 const 名單 = [ ...new Set(全.flatMap((o => Object.keys(o.材料)))) ];
 const 階級 = v => v <= 0 ? "1 階 0 級" : `${Math.ceil(v / 30)} 階 ${v - (Math.ceil(v / 30) - 1) * 30} 級`;
 const 梯 = await 階梯板({
  "樣式": "拉桿",
  "鍵": "夥伴心途",
  "下限": 0,
  "上限": 上,
  "單位": "",
  "起始": 0,
  "目標": 上,
  "材料": await _料格(名單),
  "格式": 階級,
  "格式H": v => {
   const 階 = v <= 0 ? 1 : Math.ceil(v / 30);
   const 級 = v <= 0 ? 0 : v - (階 - 1) * 30;
   return `${階}<i>階</i>${級}<i>級</i>`;
  },
  "圖": v => {
   const o = 全.find((n => n.節點 === Math.max(1, v))) || 全[0];
   return o && o.圖示 ? `<img src="${window.素材基底}介面/心途/${o.圖示}.png" alt="">` : "";
  },
  "算": (a, b) => {
   const 需 = {};
   for (const o of 全) if (o.節點 > a && o.節點 <= b) _加(需, o.材料);
   return 需;
  }
 });
 const 共 = ((r.心途共鳴 || {}).各級 || []).filter((o => o.等級 > 0));
 return 梯 + (共.length ? `<h3 class="grp">心途共鳴</h3><div class="rows">${共.map((o => kv(o.等級 + " 級", esc(o.條件 || "")))).join("")}</div>\n       <p class="note">全夥伴共用一個等級,不分五行也不分夥伴。</p>` : "");
}

function 技能表(x) {
 const a0 = x.技能 || [];
 if (!a0.length) return "";
 const 併 = new Map;
 for (const s of a0) {
  const k = s.名稱 + "|" + JSON.stringify((s.階梯 || []).map((n => [ n.階, n.技能等級, n.節點效果 ])));
  if (併.has(k)) 併.get(k).份++; else 併.set(k, Object.assign({
   "份": 1
  }, s));
 }
 const a = [ ...併.values() ];
 return a.map((s => {
  const 梯 = s.階梯 || [];
  const 圖 = s.圖 ? `<img class="skico" src="${window.素材基底}夥伴/${encodeURIComponent(x._名)}/技能/${encodeURIComponent(s.圖)}.png" alt="">` : "";
  return `<h3 class="grp skrow">${圖}<span>${esc(s.名稱)}${s.份 > 1 ? ` ×${s.份}` : ""}</span></h3>` + `<p class="note">${esc([ s.類型台版字串 || s.類型, s.定位 ].filter(Boolean).join(" · "))}${s.份 > 1 ? ` · 同時有 ${s.份} 個,升階時一起升` : ""}</p>` + (梯.length ? `<table class="aff"><thead><tr><th>突破階</th><th>技能等級</th><th>效果</th></tr></thead><tbody>${梯.map((n => `<tr><td>${n.階}</td><td>${n.技能等級}</td><td>${rich(n.節點效果 || "")}</td></tr>`)).join("")}</tbody></table>` : `<p class="desc">${rich(s.說明 || "")}</p>`);
 })).join("");
}

開範本({
 "類別": "夥伴",
 "抬頭樣式": "全身",
 "副標不帶品質": true,
 "副標": x => [ x.稀有度, x.限定 ? "限定" : null, x.稱號, x.屬性 ],
 "分頁": async (x, 清單) => [ [ "資訊", rows([ [ "稱號", x => x.稱號 ], [ "稀有度", x => x.稀有度 + (x.限定 ? " · 限定" : "") ], [ "屬性", x => x.屬性 ], [ "職業類型", x => x.職業類型 ], [ "定位", x => x.定位 ], [ "突破上限", x => x.突破上限 ], [ "可覺醒", x => x.可覺醒 === true ? "是" : x.可覺醒 === false ? "否" : null ], [ "心途上限", x => x.心途上限 ], [ "攻擊", x => x.攻擊 ? `基礎 ${x.攻擊.基礎} · 成長 ${x.攻擊.成長}` : null ], [ "防禦", x => x.防禦 ? `基礎 ${x.防禦.基礎} · 成長 ${x.防禦.成長}` : null ], [ "氣勢", x => x.氣勢 ? `基礎 ${x.氣勢.基礎} · 成長 ${x.氣勢.成長}` : null ], [ "星座", x => x.星座 ], [ "生日", x => x.生日 ], [ "血型", x => x.血型 ], [ "年齡", x => x.年齡 ] ], x) + 延後(碎片格(x)) + 延後(家族(x, 清單)) ], [ "介紹", x.介紹 ? `<p class="desc">${rich(String(x.介紹)).replace(/\n/g, "<br>")}</p>` : '<p class="note">沒有</p>' ], [ "獲取", async () => await 獲取頁(x) || '<p class="note">尚未建檔</p>' ], [ "技能", 技能表(x) || '<p class="note">沒有</p>' ], [ "升級", () => 升級板(x) ], [ "突破", () => 突破板(x) ], ...x.升星上限 ? [ [ "升星", () => 升星板(x) ] ] : [], [ "心途", () => 心途板(x) ], [ "好感", async () => await 好感板(x) || '<p class="note">沒有</p>' ], [ "其他", rows([ [ "編號", x => x.id ?? x.編號 ], [ "傳記章數", x => x.傳記章數 ] ], x) ] ]
});</script></body></html>
