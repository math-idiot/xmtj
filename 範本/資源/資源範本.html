<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資源 · 巡夢圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../共用.css?v=202611240022">
</head><body><div class="page" id="app"></div>
<script src="../共用.js?v=202611240022"></script>
<script>開範本({
 "類別": "資源",
 "副標": x => [ x.所屬活動 ? "活動限定" : null ],
 "分頁": async (x, 清單) => {
  const 屬 = x.所屬活動 ? await 引用排([ {
   "類": "活動",
   "名": x.所屬活動,
   "顯類型": false
  } ], "所屬活動") : `<h3 class="grp">所屬活動</h3><p class="note">沒有</p>`;
  return [ [ "資訊", rows([ [ "品質", x => x.品質 ], [ "說明", x => x.說明 ], [ "別稱", x => x.別稱 ] ], x) + 屬 + (x.這是什麼 ? `<h3 class="grp">這是什麼</h3><p class="note long">${rich(x.這是什麼)}</p>` : "") ], [ "獲取方式", async () => await 獲取頁(x) || '<p class="note">尚未建檔</p>' ], [ "用途", async () => await 用途頁(x) || '<p class="note">沒有用途</p>' ], [ "全部資源", async () => await 索引排("資源", 清單, x._名, "全部資源") || '<p class="note">沒有</p>' ], [ "其他", rows([ [ "資源編號", x => x.資源編號 ?? x.編號 ], [ "對應圖像編號", x => x.對應圖像編號 ?? x.圖像編號 ], ...x.所屬活動 ? [ [ "檔期", x => x.檔期 ] ] : [] ], x) ] ];
 }
});</script></body></html>
