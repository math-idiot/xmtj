<script>const _珍 = {};

async function 珍表(名) {
 if (_珍[名] === undefined) _珍[名] = await fetch(window.素材基底 + "珍寶/_" + 名 + ".json").then((r => r.ok ? r.json() : null)).catch((() => null));
 return _珍[名];
}

const _靈砂 = [ {
 "名": "珍品靈砂·大",
 "值": 1e3
}, {
 "名": "珍品靈砂·中",
 "值": 250
}, {
 "名": "珍品靈砂·小",
 "值": 50
} ];

function 貪心(經驗, 幣) {
 let T = 經驗;
 const 需 = {};
 for (const c of 幣) {
  const n = Math.floor(T / c.值);
  if (n) {
   需[c.名] = n;
   T -= n * c.值;
  }
 }
 if (T > 0) {
  需[幣[幣.length - 1].名] = (需[幣[幣.length - 1].名] || 0) + 1;
 }
 return 需;
}

async function 升級板(x) {
 const r = await 珍表("升級");
 const t = r && x.升級範本 && r.範本[String(x.升級範本)];
 if (!t) return '<p class="note">這件沒有升級資料</p>';
 const 級 = t.級, 上 = 級.length;
 const 累經 = [ 0 ];
 for (const l of 級) 累經.push(累經[累經.length - 1] + l.經驗);
 const 梯 = await 階梯板({
  "樣式": "拉桿",
  "鍵": "珍寶升級",
  "下限": 0,
  "上限": 上,
  "單位": "級",
  "起始": 0,
  "目標": 上,
  "圖": v => `<span class="txt">Lv.${v}</span>`,
  "材料": _靈砂.map((c => ({
   "類": "道具",
   "名": c.名
  }))),
  "算": (a, b) => {
   const 經 = 累經[b] - 累經[a];
   return 貪心(經, _靈砂);
  },
  "附文": (a, b) => {
   const 經 = 累經[b] - 累經[a];
   const l = 級[Math.max(0, b - 1)];
   return b > 0 ? `共需 ${經.toLocaleString("zh-TW")} 經驗 · ${l ? l.累計屬性 : ""}` : "";
  }
 });
 return 梯 + 心醫門檻板(t.心醫門檻, "升");
}

async function 突破板(x) {
 if (!x.突破範本) return '<p class="note">這件沒有突破(低品質珍寶無突破)</p>';
 const r = await 珍表("突破");
 const t = r && r.範本[String(x.突破範本)];
 if (!t) return '<p class="note">讀不到突破表</p>';
 const 階 = t.階, 上 = Math.max(...階.map((s => +s.階)));
 const 珍圖 = window.素材基底 + "珍寶/" + encodeURIComponent(x._名) + "/圖.png";
 const 梯 = await 階梯板({
  "樣式": "拉桿",
  "鍵": "珍寶突破",
  "下限": 0,
  "上限": 上,
  "單位": "階",
  "起始": 0,
  "目標": 上,
  "圖": v => 突破徽(珍圖, v),
  "材料": [ {
   "類": "道具",
   "名": "幸運之花"
  }, {
   "類": "道具",
   "名": "守護之花"
  }, {
   "類": "道具",
   "名": "命運之花"
  }, {
   "類": "珍寶",
   "名": x._名
  } ],
  "算": (a, b) => {
   const 需 = {};
   for (const s of 階) if (+s.階 >= a && +s.階 < b) for (const k in s.材料 || {}) {
    if (k === "@自己") 需[x._名] = (需[x._名] || 0) + s.材料[k]; else 需[k] = (需[k] || 0) + s.材料[k];
   }
   return 需;
  }
 });
 const 門 = 階.filter((s => s.心醫門檻)).map((s => ({
  "到": "第 " + s.階 + " 階",
  "需": s.心醫門檻
 })));
 return 梯 + (門.length ? 心醫門檻板(門, "突破") : "");
}

async function 技能板(x) {
 const a = x.技能 || [];
 if (!a.length) return "";
 const r = x.突破範本 ? await 珍表("突破") : null;
 const t = r && r.範本[String(x.突破範本)];
 const 階映 = {};
 if (t) for (const s of t.階) {
  const lv = +s.技能等級;
  if (階映[lv] == null) 階映[lv] = +s.階;
 }
 return (await Promise.all(a.map((async s => {
  const u = window.素材基底 + "珍寶/" + encodeURIComponent(x._名) + "/技能/被.png";
  const 有 = await new Promise((ok => {
   const im = new Image;
   im.onload = () => ok(true);
   im.onerror = () => ok(false);
   im.src = u;
  }));
  const lv = s.等級 || [];
  return `<h3 class="grp skrow">${有 ? `<img class="skico" src="${u}" alt="">` : ""}<span>${esc(s.名稱 || "")}</span></h3>` + (x.定位 ? `<p class="note">${esc(x.定位)}</p>` : "") + `<table class="aff"><thead><tr><th>${t ? "突破階" : ""}</th><th>技能等級</th><th>效果</th></tr></thead><tbody>${lv.map((l => `<tr><td>${t && 階映[l.級] != null ? 階映[l.級] : ""}</td><td>${l.級}</td><td>${rich(l.說明 || "")}</td></tr>`)).join("")}</tbody></table>`;
 })))).join("");
}

開範本({
 "類別": "珍寶",
 "抬頭不框": true,
 "品質為稀有": true,
 "副標": x => [ x.階 != null ? "第 " + x.階 + " 階" : null, x.定位, x.專屬 ? "專屬" : null ],
