<script>async function 角等級板() {
 const t = await 心醫表();
 const a = t && t.等級 || [];
 if (!a.length) return '<p class="note">沒有</p>';
 const 鍵 = "心醫等級", 級 = v => a[v - 1], 數 = v => Number(v || 0).toLocaleString("zh-TW");
 const 得 = [];
 const 得名 = new Map;
 for (const r of a) {
  const 列 = (r.解鎖能力 || []).map((n => ({
   "類": "能力",
   "名": n,
   "量": 1
  })));
  for (const c of String(r.獎勵 || "").split(",").map((x => x.trim())).filter(Boolean)) {
   const h = await 解獎勵(c);
   if (h) 列.push({
    "類": h.類,
    "名": h.名,
    "量": h.量 || 1
   });
  }
  得.push(列);
  for (const o of 列) 得名.set(o.類 + "/" + o.名, {
   "類": o.類,
   "名": o.名
  });
 }
 const 門 = [];
 let 威 = 0, 影 = 0;
 for (const r of a) {
  const 條 = r.條件 || {};
  if (條.威望值 != null) 威 = 條.威望值;
  if (條.家族影響力 != null) 影 = 條.家族影響力;
  門.push({
   "威望值": 威,
   "家族影響力": 影
  });
 }
 const 梯 = await 階梯板({
  "樣式": "拉桿",
  "鍵": 鍵,
  "下限": 1,
  "上限": a.length,
  "單位": "級",
  "起始": 1,
  "目標": 50,
  "標": v => (級(v) || {}).階級 || "",
  "材料": [ {
   "類": "資源",
   "名": "個人名望"
  }, {
   "類": "資源",
   "名": "家族影響力"
  } ],
  "料標": "需要達到",
  "算": (x, y) => ({
   "個人名望": (門[y - 1] || {}).威望值 || 0,
   "家族影響力": (門[y - 1] || {}).家族影響力 || 0
  }),
  "獲得": {
   "材料": [ ...得名.values() ],
   "標": "獲得",
   "算": (x, y) => {
    const g = {};
    for (let v = x + 1; v <= y; v++) for (const o of 得[v - 1]) g[o.名] = (g[o.名] || 0) + o.量;
    return g;
   }
  },
  "附文": (x, y) => {
   const r = 級(y) || {};
   let 考 = 0, 選 = 0;
   for (let v = x + 1; v <= y; v++) {
    if (級(v).考核) 考++;
    if (級(v).可選能力) 選++;
   }
   return [ `${y} 級・${r.階級 || ""}`, `總能力點需達 ${數((r.條件 || {}).總能力點)}`, `夥伴可升到 ${r.夥伴升級上限} 級`, `裝備可強化到 ${r.裝備強化上限}`, 考 ? `頭銜考核 ${考} 次` : "", 選 ? `可選能力 ${選} 次` : "" ].filter(Boolean).join(" · ");
  }
 });
 return (梯 || '<p class="note">沒有</p>') + `<p class="note">需要達到的是門檻(到目標那一級要有多少),不是累計消耗。總能力點是六項能力的總和。頭銜考核每 5 級一次(36 級起),考過才能再升。</p>`;
}

async function 角時裝板() {
 const 卡 = await 引用塊({
  "類": "時裝",
  "名": "浮香引",
  "附註": "預設時裝"
 });
 return `<div class="objs fam">${卡}</div><p class="note">全身的樣子由穿著的時裝決定。<a href="../時裝/${_靜態() ? "清單.html" : "時裝範本.html"}">全部時裝</a></p>`;
}

開範本({
 "類別": "主角",

 "副標不帶品質": true,

 "分頁": async (x, 清單) => [ [ "資訊", rows([ [ "稱號", x => x.稱號 ], [ "介紹", x => x.介紹 ], [ "生日", x => x.生日 ], [ "星座", x => x.星座 ], [ "血型", x => x.血型 ], [ "年齡", x => x.年齡 ] ], x) ], [ "心醫等級", () => 角等級板() ], [ "時裝", () => 角時裝板() ], [ "其他", rows([ [ "編號", x => x.id ] ], x) ] ]
});</script></body></html>
